name: Build Edit Sathi Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Platform 36 & Accept Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager "platforms;android-36" || true
          yes | sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Flutter Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          echo "=== Searching for generated APK ==="
          ls -la build/app/outputs/flutter-apk/ || true

          APK_PATH=""
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="build/app/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find build/ -type f -name "*release*.apk" 2>/dev/null | head -n 1 || true)
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | grep -i "release" | head -n 1 || true)
            fi
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
            fi
          fi

          echo "Selected APK path: '$APK_PATH'"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found! Directory contents:"
            find . -maxdepth 4 || true
            exit 1
          fi

          cp "$APK_PATH" release-output/Edit-Sathi-v1.0.2.apk
          cp "$APK_PATH" release-output/Edit-Sathi-release.apk
          echo "APKs successfully prepared:"
          ls -lh release-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Sathi-v1.0.2-APK
          path: release-output/Edit-Sathi-v1.0.2.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.2
          name: "Edit Sathi v1.0.2 - Premiere Pro Multi-Track & Lag-Free Playback"
          body: |
            ## 🎬 Edit Sathi - Video Editing Application (Android APK v1.0.2)

            ### 🚀 What's New in v1.0.2
            - **⚡ 100% Lag-Free Playback Engine**: ExoPlayer hardware decoder clock decoupled from Dart seek loops. Zero frame drops, no seek stutter, silky smooth 60fps playback.
            - **▶️ Dedicated Transport Controls**:
              - Prominent cyan/blue glowing Play / Pause button.
              - Exact monospace timecode display (`00:03.12 / 00:28.00`).
              - Quick Step `-1s` / `+1s` controls.
              - Instant Split clip at current playhead (`✂`).
              - Timeline Zoom In (`+`) and Zoom Out (`-`).
              - `+ Track` shortcut button.
            - **🎞️ Adobe Premiere Pro Style Stacked Multi-Track Timeline**:
              - Stacked Video Tracks (`V1`, `V2`, `V3`...) with visual filmstrip frame indicators.
              - Stacked Audio Tracks (`A1`, `A2`, `A3`...) with real-time waveform bars.
              - Text & Subtitle track lane (`TXT`).
            - **🎛️ Left Track Header Dock**:
              - Track Badges (`V1`, `V2`, `TXT`, `A1`, `A2`).
              - Eye button: Toggle track visibility / hide track.
              - Mute button: Toggle track audio mute.
              - Lock button: Prevent accidental edits.
              - Direct `+` Add Clip button per track to place media directly on that lane.
            - **↔️ Unblocked Timeline Scrolling & Extended Trailing Canvas**:
              - Horizontal drag conflicts removed so thumb swiping scrolls the timeline naturally with fluid inertia.
              - +400px extended blank canvas space past the last clip to easily scroll forward and place new clips.
              - Playhead scrubbing on the interactive Time Ruler and needle knob.
              - Smooth auto-scrolling during playback to keep playhead in view.

            ### 📲 How to Install
            1. Download `Edit-Sathi-v1.0.2.apk` below directly to your Android device.
            2. Tap the file to install (Enable *"Install from Unknown Sources"* if prompted).
            3. Open Edit Sathi and start editing!
          files: |
            release-output/Edit-Sathi-v1.0.2.apk
            release-output/Edit-Sathi-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
