name: Build Edit Sathi Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Platform 36 & Accept Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager "platforms;android-36" || true
          yes | sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Flutter Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          echo "=== Searching for generated APK ==="
          ls -la build/app/outputs/flutter-apk/ || true

          APK_PATH=""
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="build/app/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find build/ -type f -name "*release*.apk" 2>/dev/null | head -n 1 || true)
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | grep -i "release" | head -n 1 || true)
            fi
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
            fi
          fi

          echo "Selected APK path: '$APK_PATH'"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found! Directory contents:"
            find . -maxdepth 4 || true
            exit 1
          fi

          cp "$APK_PATH" release-output/Edit-Sathi-v1.0.4.apk
          cp "$APK_PATH" release-output/Edit-Sathi-release.apk
          echo "APKs successfully prepared:"
          ls -lh release-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Sathi-v1.0.4-APK
          path: release-output/Edit-Sathi-v1.0.4.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.4
          name: "Edit Sathi v1.0.4 - Premiere Pro, VN & CapCut Pro Suite + Live Video Thumbnails"
          body: |
            ## 🎬 Edit Sathi - Video Editing Application (Android APK v1.0.4)

            ### 🚀 What's New in v1.0.4

            - **🖼️ Real Video Thumbnails on Home & Projects Screen**:
              - Native Android `MediaMetadataRetriever` extraction on a background thread with JPEG disk caching.
              - Live video frame preview on project cards with duration badges, aspect badges, and play buttons.
              - Fallback graceful gradient placeholders when media is loading.

            - **✨ Premiere Pro & CapCut Video Transitions**:
              - 10+ professional transitions: Cross Dissolve, Dip to Black, Dip to White, Wipe Left, Wipe Right, Slide Left, Slide Right, Zoom In, Zoom Out, and Glitch Flash.
              - Transition duration control (0.2s to 2.0s).
              - **Apply to All Clips** one-tap button for whole-timeline continuity.
              - Interactive transition badges `|⧗|` on timeline tracks to edit transitions with a single tap.

            - **⚡ CapCut & VN Speed Curve Ramping**:
              - Standard speed controls from 0.1x to 10.0x with smooth decimal precision and quick presets.
              - Speed Curve Ramping with real-time Bezier visual graph:
                - **Montage**: Dynamic rhythm with high-speed burst.
                - **Hero**: Dramatic slow-motion focus center.
                - **Bullet Time**: Rapid entry and exit with ultra slow-mo centerpiece.
                - **Jump Cut**: Alternating bursts for beat matching.
                - **Flash In / Flash Out**: Acceleration and deceleration ramps.

            - **◆ Keyframe Animation (Motion Graphics)**:
              - Place diamond keyframe markers `◆` on timeline clips at any playhead timestamp.
              - Smooth cubic/linear interpolation for scale, rotation, X/Y translation, and opacity during playback.
              - Add/Remove keyframe buttons on the contextual clip action bar.

            - **🎙️ Audio Studio & Voice Effects**:
              - Volume boost slider up to 200%.
              - Tactile Fade-In and Fade-Out duration sliders (0.0s to 5.0s).
              - 8 Voice Effects & Audio FX presets: Original, Bass Boost, Crisp Vocal, Echo/Reverb, Telephone, Robot, Deep Voice, and Chipmunk.

            - **🎨 Studio Canvas Background (Blur Fill, Colors & Gradients)**:
              - **Blur Fill**: Fills canvas margins with a soft blurred copy of the video (Soft, Medium, Heavy blur sigma).
              - **Solid Color**: Studio color palette (Pitch Black, Slate, Charcoal, Indigo, Purple, Emerald, Crimson, Pure White).
              - **Gradient**: Modern aesthetic gradients (Sunset, Cyber Neon, Deep Ocean, Purple Haze, Midnight Gold).

            - **✂️ Smart Ripple Delete**:
              - Premiere Pro style ripple delete automatically removes clip and shifts subsequent clips on the track to eliminate empty gaps.

            - **⚡ Performance & 100% On-Device Processing**:
              - Zero cloud dependencies, complete privacy, and zero subscription costs.

            ### 📲 How to Install
            1. Download `Edit-Sathi-v1.0.4.apk` below directly to your Android device.
            2. Tap the file to install (Enable *"Install from Unknown Sources"* if prompted).
            3. Open Edit Sathi and start editing like a pro!
          files: |
            release-output/Edit-Sathi-v1.0.4.apk
            release-output/Edit-Sathi-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
