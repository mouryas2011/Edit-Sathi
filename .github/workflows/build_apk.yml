name: Build Edit Sathi Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Platform 36 & Accept Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager "platforms;android-36" || true
          yes | sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Flutter Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          echo "=== Searching for generated APK ==="
          ls -la build/app/outputs/flutter-apk/ || true

          APK_PATH=""
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            APK_PATH="build/app/outputs/apk/release/app-release.apk"
          else
            APK_PATH=$(find build/ -type f -name "*release*.apk" 2>/dev/null | head -n 1 || true)
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | grep -i "release" | head -n 1 || true)
            fi
            if [ -z "$APK_PATH" ]; then
              APK_PATH=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
            fi
          fi

          echo "Selected APK path: '$APK_PATH'"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found! Directory contents:"
            find . -maxdepth 4 || true
            exit 1
          fi

          cp "$APK_PATH" release-output/Edit-Sathi-v1.0.3.apk
          cp "$APK_PATH" release-output/Edit-Sathi-release.apk
          echo "APKs successfully prepared:"
          ls -lh release-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edit-Sathi-v1.0.3-APK
          path: release-output/Edit-Sathi-v1.0.3.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v1.0.3
          name: "Edit Sathi v1.0.3 - Touch Transformation, Shapes & Adjustment Layers"
          body: |
            ## 🎬 Edit Sathi - Video Editing Application (Android APK v1.0.3)

            ### 🚀 What's New in v1.0.3
            - **👌 Interactive Touch Transformations (Zoom, Rotate & Scale)**:
              - **Touch-to-Zoom**: Pinch on the video canvas to scale clips dynamically from 20% to 500%.
              - **Two-Finger Rotate**: Twist with two fingers to rotate video clips in real-time.
              - **Drag-to-Pan**: Drag anywhere on screen to reposition the active video.
              - **Cyan Transform Gizmo**: Interactive bounding box with 4 corner anchors, top rotation stalk, and floating quick controls (Scale %, Rotation °, Flip H, Flip V, Reset, and Tune).
              - **Fine-Tune Transform Sheet**: Precise sliders for scale, rotation angle wheel, X/Y offsets, preset aspect scales (Fit, Fill, 1.25x, 1.5x, 2x), and one-tap reset.
            - **🔷 Graphic Shape Overlays**:
              - 8 vector shapes: Rectangle, Rounded Box, Circle, Arrow, Star, Heart, Callout Bubble, and Divider Line.
              - Color palette, border stroke color, stroke width, opacity, corner radius, and duration controls.
              - Draggable directly on canvas to reposition, with dedicated **SHP** timeline lane to trim and edit.
            - **🎚️ Adobe Premiere Pro Style Adjustment Layers**:
              - Non-destructive color grading layer that affects all clips underneath across the timeline.
              - Real-time 5x4 color matrix engine adjusting brightness, contrast, saturation, opacity, and preset LUTs (Cinematic, Warm Sunset, Cool Blue, Retro Vintage, Black & White, Vivid Pop).
              - Dedicated **ADJ** timeline lane and amber indicator pill on canvas for instant live adjustments.
            - **🖐️ CapCut & VN Style Interactive Timeline**:
              - **Touch & Drag-to-Move**: Touch any media clip on the timeline to slide and reposition horizontally with magnetic snapping to 0:00 and playhead.
              - **Left & Right Trim Handles**: Selected clips feature tactile trim grip handles to adjust in-points and out-points interactively.
              - **Contextual Clip Action Bar**: Pinned quick toolbar appears on selection for instant Split, Transform, Speed, Filter, Duplicate, and Delete.
              - Universal support across Video, Audio, Text, Shapes, and Adjustment Layers.
            - **⚡ Performance & Stability**:
              - 100% on-device processing, zero cloud dependencies.
              - Smooth 60fps gesture handling and Exoplayer playback sync.

            ### 📲 How to Install
            1. Download `Edit-Sathi-v1.0.3.apk` below directly to your Android device.
            2. Tap the file to install (Enable *"Install from Unknown Sources"* if prompted).
            3. Open Edit Sathi and start editing!
          files: |
            release-output/Edit-Sathi-v1.0.3.apk
            release-output/Edit-Sathi-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
